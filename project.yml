name: OpenContexts
options:
  deploymentTarget:
    macOS: "13.0"
packages:
  OpenContexts:
    path: .
targets:
  OpenContexts:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: assets/AppIcon.icns
    dependencies:
      - package: OpenContexts
        product: OpenContextsApp
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Open Contexts
        CFBundleDisplayName: Open Contexts
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shayelkin.opencontexts
        MARKETING_VERSION: "0.6"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme: {}
